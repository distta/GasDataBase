name: Gas catalogue validation and Pages deployment

on:
  push:
    branches: [main]
    paths:
      - "GasDataBase/**"
      - "tools/build_gas_index.py"
      - "assets/**"
      - "catalog/**"
      - "tools/catalog.py"
      - "tools/build_site.py"
      - "index.html"
      - "README.md"
      - "QUICK_START.md"
      - "Doc/**"
      - "tests/**"
      - ".github/workflows/gas-search.yml"
  pull_request:
    paths:
      - "GasDataBase/**"
      - "tools/build_gas_index.py"
      - "assets/**"
      - "catalog/**"
      - "tools/catalog.py"
      - "tools/build_site.py"
      - "index.html"
      - "README.md"
      - "QUICK_START.md"
      - "Doc/**"
      - "tests/**"
      - ".github/workflows/gas-search.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gas-search-pages
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test index builder
        run: python3 -m unittest discover -s tests -v
      - name: Test shared gas parser against repository files
        run: node tests/test-gas-file-parser.js
      - name: Test gas component and result ordering
        run: node tests/test-catalog-order.js
      - name: Build deployment index from gas files
        run: python3 tools/catalog.py
      - name: Verify generated index
        run: python3 tools/catalog.py --check
      - name: Package static website
        run: python3 tools/build_site.py
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload generated Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
